<app-page width="narrow" [title]="title" backLink="/wiki" [backLabel]="'navigation.wiki' | translate">
  @if (isPublic) {
    <div pageMeta class="mt-2">
      <span class="badge-soft badge-accent"><fa-icon icon="users"></fa-icon>{{ 'label.article.openEditing' | translate }}</span>
    </div>
  }
  <app-placeholder [loading]="loading$" [height]="6" [count]="3"></app-placeholder>
  @if (selected$ | async; as selected) {
    <app-section [selected]="selected" [isPublic]="isPublic"></app-section>
  }
</app-page>
