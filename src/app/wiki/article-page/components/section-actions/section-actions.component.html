<ng-template [isPublic]="isPublic ?? false" [appHasAccess]="section?.createdBy">
  <button
    type="button"
    class="btn btn-ghost btn-icon btn-sm"
    [ngbTooltip]="'action.section.addSub' | translate"
    [attr.aria-label]="'action.section.addSub' | translate"
    (click)="add()"
  >
    <fa-icon icon="plus"></fa-icon>
  </button>
</ng-template>
<ng-template [appHasAccess]="section?.createdBy">
  <button
    type="button"
    class="btn btn-ghost btn-icon btn-sm"
    [ngbTooltip]="'button.edit' | translate"
    [attr.aria-label]="'button.edit' | translate"
    (click)="edit()"
  >
    <fa-icon icon="pen"></fa-icon>
  </button>
  <button
    type="button"
    class="btn btn-danger-ghost btn-icon btn-sm"
    [ngbTooltip]="'button.delete' | translate"
    [attr.aria-label]="'button.delete' | translate"
    (click)="delete()"
  >
    <fa-icon icon="trash-can"></fa-icon>
  </button>
</ng-template>
