<form [formGroup]="form" (ngSubmit)="save()">
  <div class="modal-header">
    <h2 class="modal-title">{{ (isEdit ? 'label.section.edit' : 'label.section.create') | translate }}</h2>
    <button type="button" class="btn-close" [attr.aria-label]="'button.close' | translate" (click)="cancel()"></button>
  </div>
  <div class="modal-body">
    <label class="form-label" for="section-title">{{ 'label.section.title' | translate }}</label>
    <input id="section-title" class="form-control" formControlName="title" autocomplete="off" ngbAutofocus />

    <label class="form-label mt-3" for="section-text">{{ 'label.section.text' | translate }}</label>
    <textarea
      id="section-text"
      class="form-control section-text"
      formControlName="text"
      rows="8"
      #textArea
      (input)="autoResize(textArea)"
    ></textarea>
    <div class="form-text">{{ 'label.section.markdownHint' | translate }}</div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-ghost" (click)="cancel()">{{ 'button.cancel' | translate }}</button>
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid">{{ 'button.save' | translate }}</button>
  </div>
</form>
