<form [formGroup]="form" (ngSubmit)="save()">
  <div class="modal-header">
    <h2 class="modal-title">{{ (isEdit ? 'label.article.edit' : 'label.article.create') | translate }}</h2>
    <button type="button" class="btn-close" [attr.aria-label]="'button.close' | translate" (click)="cancel()"></button>
  </div>
  <div class="modal-body">
    <label class="form-label" for="article-title">{{ 'label.article.title' | translate }}</label>
    <input id="article-title" class="form-control" formControlName="title" autocomplete="off" ngbAutofocus />

    <fieldset class="mt-4">
      <legend class="form-label">{{ 'label.article.visibility.label' | translate }}</legend>
      <div class="options">
        @for (option of visibilityOptions; track option.value) {
          <label class="option" [class.selected]="form.controls.visibility.value === option.value">
            <input type="radio" class="visually-hidden" formControlName="visibility" [value]="option.value" />
            <span class="option-icon"><fa-icon [icon]="option.icon"></fa-icon></span>
            <span class="option-text">
              <span class="option-title">{{ option.label | translate }}</span>
              <span class="option-hint">{{ option.hint | translate }}</span>
            </span>
          </label>
        }
      </div>
    </fieldset>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-ghost" (click)="cancel()">{{ 'button.cancel' | translate }}</button>
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
      {{ (isEdit ? 'button.save' : 'button.create') | translate }}
    </button>
  </div>
</form>
