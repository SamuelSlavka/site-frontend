<app-page [title]="'navigation.dashboard' | translate" [subtitle]="'label.dashboard.subtitle' | translate">
  <div class="dash-grid">
    <app-weather class="card tile"></app-weather>
    @if (isAdmin$ | async) {
      <app-measurement class="card tile"></app-measurement>
    }
    <app-picture class="card photo" [imgnum]="1"></app-picture>
    <app-forecast class="card tile forecast"></app-forecast>
    <app-picture class="card photo d-none d-md-block" [imgnum]="2"></app-picture>
  </div>
</app-page>
