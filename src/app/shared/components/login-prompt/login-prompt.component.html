<div class="modal-header">
  <h2 class="modal-title">{{ 'label.login.title' | translate }}</h2>
  <button type="button" class="btn-close" [attr.aria-label]="'button.close' | translate" (click)="cancel()"></button>
</div>
<div class="modal-body text-body-secondary">
  {{ 'label.login.needToLog' | translate }}
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-ghost" (click)="cancel()">{{ 'button.cancel' | translate }}</button>
  <button type="button" class="btn btn-primary" ngbAutofocus (click)="login()">{{ 'button.login' | translate }}</button>
</div>
