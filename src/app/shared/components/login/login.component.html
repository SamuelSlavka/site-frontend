@if (!(isLoggedIn$ | async)) {
  <button type="button" class="btn btn-primary" [attr.aria-label]="'button.login' | translate" (click)="login()">
    {{ 'button.login' | translate }}
  </button>
} @else {
  <div dropdown class="d-inline-block btn-group dropdown-wrapper" container="body">
    <button
      type="button"
      class="btn btn-outline-primary dropdown-toggle"
      id="profile-dropdown-toggle"
      aria-controls="profile-dropdown-menu"
      aria-haspopup="menu"
      dropdownToggle
    >
      {{ (profile$ | async)?.email }}
    </button>
    <ul id="profile-dropdown-menu" *dropdownMenu class="dropdown-menu" role="menu" aria-labelledby="profile-dropdown-toggle">
      <li role="menuitem">
        <button type="button" class="dropdown-item" (click)="toggleShowActions()">
          @if (showActions$ | async) {
            <span>{{ 'action.login.hide' | translate }}</span>
          } @else {
            @if (!(showActions$ | async)) {
              <span>{{ 'action.login.show' | translate }}</span>
            }
          }
        </button>
        @if (isAdmin$ | async) {
          <button type="button" class="dropdown-item" (click)="goToAdmin()">
            <span>{{ 'action.login.admin' | translate }}</span>
          </button>
        }
      </li>
      <li role="menuitem">
        <button type="button" class="dropdown-item" (click)="logout()">
          {{ 'button.logout' | translate }}
        </button>
      </li>
    </ul>
  </div>
}
